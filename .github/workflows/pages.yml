name: Deploy Wrangl to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'wrangl/dist/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch: # lets you re-publish by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a running one finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          # wrangl.html is fully self-contained, so the site is just that one file.
          test -s wrangl/dist/wrangl.html
          mkdir -p _site
          cp wrangl/dist/wrangl.html _site/index.html
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
